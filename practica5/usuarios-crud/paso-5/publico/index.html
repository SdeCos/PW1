<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Usuarios</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
    form { display: flex; gap: 8px; margin-bottom: 24px; }
    input { flex: 1; padding: 6px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #ddd; }
  </style>
</head>
<body>
  <h1>Usuarios</h1>

  <form id="formulario">
    <input id="nombre" placeholder="Nombre" required>
    <input id="email" type="email" placeholder="Email" required>
    <button id="boton">Crear</button>
  </form>

  <table>
    <thead>
      <tr><th>Nombre</th><th>Email</th></tr>
    </thead>
    <tbody id="tabla"></tbody>
  </table>

  <script>
    const API = '/api/usuarios';
    const formulario = document.querySelector('#formulario');
    const nombre = document.querySelector('#nombre');
    const email = document.querySelector('#email');
    const tabla = document.querySelector('#tabla');

    // LEER: pide la lista al servidor y la pinta en la tabla
    async function cargar() {
      const respuesta = await fetch(API);
      const usuarios = await respuesta.json();
      tabla.innerHTML = '';
      for (const usuario of usuarios) {
        const fila = tabla.insertRow();
        fila.insertCell().textContent = usuario.nombre;
        fila.insertCell().textContent = usuario.email;
      }
    }

    // CREAR: al enviar el formulario
    formulario.addEventListener('submit', async (evento) => {
      evento.preventDefault();   // que el navegador no recargue la página
      const datos = { nombre: nombre.value, email: email.value };
      await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(datos)
      });
      formulario.reset();
      cargar();
    });

    cargar();   // al abrir la página
  </script>
</body>
</html>
